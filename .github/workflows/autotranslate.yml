name: Automatic full-text translation
on:
  workflow_run:
    workflows: ['Clean saved article bodies']
    types: [completed]
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autotranslate.yml'
      - 'config/automation.json'
      - 'config/ai-translation.json'
      - 'config/cloudflare-translation.json'
      - 'config/translation-priority.json'
      - 'config/editorial-regions.json'
      - 'config/attention-units.json'
      - 'backend/priority.py'
      - 'backend/frontpage.py'
      - 'backend/editorial_regions.py'
      - 'backend/attention_units.py'
      - 'backend/ai_translation.py'
      - 'backend/ai_retry.py'
      - 'backend/cloudflare_translation.py'
      - 'scripts/run_cloudflare_translation.py'
      - 'backend/ai_pool.py'
      - 'scripts/run_ai_translation.py'
      - 'scripts/reserve_ai_quota.py'
      - 'backend/offline_model.py'
      - 'backend/autonomous_translation.py'
      - 'scripts/run_auto_translation.py'
permissions:
  contents: write
  actions: write
concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'cancelled' && format('ignored-cancelled-collection-{0}', github.run_id) || 'cultural-news-data-write' }}
  cancel-in-progress: false
jobs:
  translate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AI_RUN_RESERVATION: ${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-translation.txt
      - run: pip install -r requirements.txt
      - id: restore
        run: python scripts/import_snapshot.py
      - name: Commit request reservation before inference
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/reserve_ai_quota.py
          python scripts/run_cloudflare_translation.py --reserve
          git config user.name 'Intermission automatic translator'
          git config user.email 'updater@users.noreply.github.com'
          for path in data/ai-translation-ledger.json data/ai-translation-ledger-secondary.json data/cloudflare-translation-ledger.json data/cloudflare-neurons-ledger.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve bounded AI requests before background inference'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Translate with contextual AI when the free-project key is configured
        id: ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
        run: |
          python scripts/run_ai_translation.py
          if jq -e '.continue_recommended == true' data/ai-translation-status.json >/dev/null; then
            echo 'continue_ai=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Free Cloudflare Qwen fallback after a blocked Gemini batch
        if: success() || failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/run_cloudflare_translation.py
      - uses: actions/cache@v4
        if: (success() || failure()) && steps.ai.outputs.continue_ai != 'true'
        with:
          path: runtime/models/m2m100-int8
          key: offline-m2m100-int8-18e406c615ef2991-v1
      - run: pip install -r requirements-translation.txt
        if: (success() || failure()) && steps.ai.outputs.continue_ai != 'true'
      - name: Temporary offline machine translation fallback
        if: success() || failure()
        id: translation
        env:
          CONTINUE_AI: ${{ steps.ai.outputs.continue_ai }}
        run: |
          if [ "$CONTINUE_AI" = 'true' ]; then
            python - <<'PY'
          from backend.autonomous_translation import write_json
          from backend.storage import ROOT, now
          write_json(ROOT / 'data/auto-translation-status.json', {
              'status': 'ai_priority', 'finished_at': now(), 'translated': [], 'failed': [],
              'reason': 'Useful contextual AI work continues; temporary offline fallback deferred.'})
          PY
          else
            python scripts/run_auto_translation.py
          fi
      - name: Save accepted work and checkpoints even after a worker error
        id: save
        if: always() && steps.restore.outcome == 'success'
        env:
          WORKER_OUTCOME: ${{ steps.translation.outcome }}
        run: |
          if [ "$WORKER_OUTCOME" = 'skipped' ]; then
            python -c 'import json,datetime; json.dump({"status":"bootstrap_failed","finished_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"translated":[]},open("data/auto-translation-status.json","w"))'
          fi
          python scripts/export_snapshot.py
          python scripts/audit_data.py --output data/quality.json --strict
          python scripts/prepare_translation_queue.py
          python scripts/audit_important_news.py
          python scripts/audit_article_quality.py --limit 20
          python scripts/update_acceptance.py
          python scripts/build_static.py
          git restore frontend/data.js
          git config user.name 'Intermission automatic translator'
          git config user.email 'updater@users.noreply.github.com'
          git add data/live.json data/quality.json data/important-news-audit.json data/translation-queue.json data/translation-queue data/translation-input data/auto-translation-progress data/auto-translation-status.json data/ai-translation-progress data/ai-translation-status.json
          if [ -f data/ai-translation-ledger.json ]; then git add data/ai-translation-ledger.json; fi
          if [ -f data/ai-translation-ledger-secondary.json ]; then git add data/ai-translation-ledger-secondary.json; fi
          if [ -d data/ai-translation-projects ]; then git add data/ai-translation-projects; fi
          for path in data/cloudflare-translation-ledger.json data/cloudflare-neurons-ledger.json data/cloudflare-translation-status.json data/cloudflare-translation-progress; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          git add data/article-quality data/article-quality-report.json data/acceptance.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save automatic AI translations and temporary machine fallback progress'
            python scripts/push_public_update.py
          fi
      - name: Publish accepted data and refresh actual health
        if: always() && steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
          gh workflow run automation-health.yml --ref main --repo "$GITHUB_REPOSITORY"
          if jq -e '.continue_recommended == true' data/ai-translation-status.json >/dev/null; then
            # Let a waiting collection run first; it will dispatch translation.
            pending_collections=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/refresh.yml/runs?branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "in_progress")] | length')
            if [ "$pending_collections" -eq 0 ]; then
              gh workflow run autotranslate.yml --ref main --repo "$GITHUB_REPOSITORY"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-checkpoints-and-report
          path: |
            data/auto-translation-progress/
            data/auto-translation-status.json
            data/ai-translation-progress/
            data/ai-translation-status.json
            data/ai-translation-ledger.json
            data/ai-translation-ledger-secondary.json
            data/ai-translation-projects/
            data/cloudflare-translation-ledger.json
            data/cloudflare-neurons-ledger.json
            data/cloudflare-translation-status.json
            data/cloudflare-translation-progress/
            runtime/public-update-evidence/
          retention-days: 7
