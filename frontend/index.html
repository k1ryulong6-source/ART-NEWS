  <script>
  /* Opening page: shown once per browser session on the front page; any click,
     key, wheel or swipe fades it away. */
  (function () {
    var cover = document.getElementById('cover'), root = document.documentElement, seen = false;
    try { seen = sessionStorage.getItem('intermission-cover') === 'turned'; } catch (error) {}
    var route = location.hash.replace(/^#/, '');
    if (seen || (route && route !== 'today' && route !== 'main')) { cover.remove(); return; }
    root.classList.add('cover-open');
    var now = new Date(), digits = '〇一二三四五六七八九';
    var number = function (n) { return n < 10 ? digits[n] : (n >= 20 ? digits[Math.floor(n / 10)] : '') + '十' + (n % 10 ? digits[n % 10] : ''); };
    document.getElementById('cover-date').textContent = String(now.getFullYear()).replace(/\d/g, function (d) { return digits[d]; }) + '年' + number(now.getMonth() + 1) + '月' + number(now.getDate()) + '日';
    var leaf = cover.querySelector('.cover-leaf'), done = false;
    function turn() {
      if (done) return; done = true;
      try { sessionStorage.setItem('intermission-cover', 'turned'); } catch (error) {}
      cover.classList.add('turning');
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(function () { cover.remove(); root.classList.remove('cover-open'); }, still ? 350 : 1100);
    }
    cover.addEventListener('click', turn);
    cover.addEventListener('wheel', turn, { passive: true });
    cover.addEventListener('touchmove', turn, { passive: true });
    cover.addEventListener('keydown', function (event) { if (['Enter', ' ', 'Escape', 'ArrowLeft', 'ArrowRight', 'PageDown'].indexOf(event.key) > -1) { event.preventDefault(); turn(); } });
    leaf.focus({ preventScroll: true });
  })();
