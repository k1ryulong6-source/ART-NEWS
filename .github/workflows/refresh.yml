name: Refresh cultural news
on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: cultural-news-data-write
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/import_snapshot.py
      - run: python scripts/record_collection_metrics.py --initialize
      - run: python -m backend.jobs
        env:
          SUMMARY_PROVIDER: 'noop'
          TRANSLATION_PROVIDER: 'disabled'
          READING_PAGE_LIMIT: '20'
          ARTICLE_PAGE_LIMIT: '60'
          EDITORIAL_PROVIDER: 'chatgpt-task'
      - run: python scripts/import_daily_translations.py
      - run: python scripts/export_snapshot.py
      - run: python scripts/record_collection_metrics.py
      - run: python scripts/audit_data.py --output data/quality.json --strict
      - run: python scripts/prepare_translation_queue.py
      - run: python scripts/audit_coverage.py
      - run: python scripts/audit_important_news.py
      - run: python scripts/audit_autonomous_trial.py --if-due
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/audit_article_quality.py --limit 20
      - run: python scripts/update_acceptance.py
      - run: python scripts/build_static.py
      - name: Save public news and article snapshot
        run: |
          git config user.name 'Culture Desk updater'
          git config user.email 'updater@users.noreply.github.com'
          git restore frontend/data.js
          git add data/live.json data/quality.json data/collection-metrics.json data/coverage-audit.json data/important-news-audit.json data/translation-queue.json data/translation-queue data/translation-input data/article-quality data/article-quality-report.json data/acceptance.json
          git add data/autonomous-trial-report.json data/trial-runs
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified cultural news snapshot'
            python scripts/push_public_update.py
          fi
      - name: Publish collection and continue translation explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
          gh workflow run autotranslate.yml --ref main --repo "$GITHUB_REPOSITORY"
          gh workflow run automation-health.yml --ref main --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: culture-desk-current
          path: |
            dist/
            runtime/public-update-evidence/
