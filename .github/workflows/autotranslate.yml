name: Automatic full-text translation
on:
  workflow_run:
    workflows: ['Refresh cultural news']
    types: [completed]
  schedule:
    - cron: '45 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autotranslate.yml'
      - 'config/automation.json'
      - 'backend/offline_model.py'
      - 'backend/autonomous_translation.py'
      - 'scripts/run_auto_translation.py'
permissions:
  contents: write
  actions: read
concurrency:
  group: cultural-news-data-write
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-translation.txt
      - run: pip install -r requirements.txt
      - id: restore
        run: python scripts/import_snapshot.py
      - uses: actions/cache@v4
        with:
          path: runtime/models/m2m100-int8
          key: offline-m2m100-int8-18e406c615ef2991-v1
      - run: pip install -r requirements-translation.txt
      - name: Translate pending full articles without an API key
        id: translation
        run: python scripts/run_auto_translation.py
      - name: Save accepted work and checkpoints even after a worker error
        if: always() && steps.restore.outcome == 'success'
        env:
          WORKER_OUTCOME: ${{ steps.translation.outcome }}
        run: |
          if [ "$WORKER_OUTCOME" = 'skipped' ]; then
            python -c 'import json,datetime; json.dump({"status":"bootstrap_failed","finished_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"translated":[]},open("data/auto-translation-status.json","w"))'
          fi
          python scripts/export_snapshot.py
          python scripts/audit_data.py --output data/quality.json --strict
          python scripts/prepare_translation_queue.py
          python scripts/build_static.py
          git restore frontend/data.js
          git config user.name 'Intermission automatic translator'
          git config user.email 'updater@users.noreply.github.com'
          git add data/live.json data/quality.json data/translation-queue.json data/translation-queue data/translation-input data/auto-translation-progress data/auto-translation-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Automatically publish verified offline machine translations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-checkpoints-and-report
          path: |
            data/auto-translation-progress/
            data/auto-translation-status.json
          retention-days: 7
