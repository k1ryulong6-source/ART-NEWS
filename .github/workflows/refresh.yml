name: Refresh cultural news
on:
  schedule:
    - cron: '15 1,13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cultural-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/import_snapshot.py
      - run: python -m backend.jobs
        env:
          SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER || 'noop' }}
          SUMMARY_BASE_URL: ${{ vars.SUMMARY_BASE_URL || 'https://api.openai.com/v1' }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL || 'gpt-4.1-mini' }}
          SUMMARY_DAILY_LIMIT: ${{ vars.SUMMARY_DAILY_LIMIT || '20' }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          TRANSLATION_PROVIDER: 'disabled'
          TRANSLATION_DAILY_LIMIT: ${{ vars.TRANSLATION_DAILY_LIMIT || '1000' }}
          READING_PAGE_LIMIT: '20'
          ARTICLE_PAGE_LIMIT: '60'
          ARTICLE_TRANSLATION_LIMIT: '120'
          EDITORIAL_PROVIDER: ${{ vars.EDITORIAL_PROVIDER || 'openai-compatible' }}
          EDITORIAL_BASE_URL: ${{ vars.EDITORIAL_BASE_URL || 'https://api.openai.com/v1' }}
          EDITORIAL_MODEL: ${{ vars.EDITORIAL_MODEL || 'gpt-4.1' }}
          EDITORIAL_REVIEW_MODEL: ${{ vars.EDITORIAL_REVIEW_MODEL || 'gpt-4.1' }}
          EDITORIAL_DAILY_LIMIT: ${{ vars.EDITORIAL_DAILY_LIMIT || '20' }}
          EDITORIAL_ARTICLE_LIMIT: ${{ vars.EDITORIAL_ARTICLE_LIMIT || '5' }}
          EDITORIAL_API_KEY: ${{ secrets.EDITORIAL_API_KEY }}
      - run: python scripts/export_snapshot.py
      - run: python scripts/audit_data.py --output data/quality.json --strict
      - run: python scripts/build_static.py
      - name: Save public news and article snapshot
        run: |
          git config user.name 'Culture Desk updater'
          git config user.email 'updater@users.noreply.github.com'
          git add data/live.json data/quality.json frontend/data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified cultural news snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: culture-desk-current
          path: dist/
