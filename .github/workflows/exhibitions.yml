name: Refresh Japan exhibitions
on:
  schedule:
    # 06:20 / 18:20 in Tokyo.
    - cron: '20 9,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: japan-exhibitions-data-write
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reconcile directories and official calendars
        run: python scripts/collect_exhibitions.py
      - name: Save only the exhibition catalogue
        run: |
          git config user.name 'Culture Desk exhibition updater'
          git config user.email 'updater@users.noreply.github.com'
          git add -- data/exhibitions-jp.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Japan exhibition inventory and coverage'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'data/exhibitions-jp.json'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Publish the updated exhibition catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-exhibition-catalogue
          path: data/exhibitions-jp.json
          retention-days: 7
