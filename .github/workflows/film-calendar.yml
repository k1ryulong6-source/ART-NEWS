name: Refresh film calendar
on:
  schedule:
    # 07:35 and 17:35 in Tokyo.
    - cron: '35 8,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: film-calendar-data-write
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read official theatre and streaming schedules
        run: python scripts/collect_film_calendar.py
      - name: Save the film calendar
        run: |
          git config user.name 'Culture Desk film calendar updater'
          git config user.email 'updater@users.noreply.github.com'
          git add -- data/film-calendar.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified film calendar schedules'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'data/film-calendar.json'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Publish the updated film calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
