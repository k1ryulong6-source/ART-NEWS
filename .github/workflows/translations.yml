name: Publish daily AI translations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/translations/**'
      - '.github/workflows/translations.yml'
permissions:
  contents: write
concurrency:
  group: cultural-news-data-write
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/import_snapshot.py
      - name: Validate and import AI translation packs
        id: translations
        run: |
          python scripts/import_daily_translations.py --report /tmp/translation-report.json
          echo "changed=$(python -c 'import json; print(str(bool(json.load(open("/tmp/translation-report.json"))["imported"])).lower())')" >> "$GITHUB_OUTPUT"
      - if: steps.translations.outputs.changed == 'true'
        run: python scripts/export_snapshot.py
      - if: steps.translations.outputs.changed == 'true'
        run: python scripts/audit_data.py --output data/quality.json --strict
      - if: steps.translations.outputs.changed == 'true'
        run: python scripts/prepare_translation_queue.py
      - if: steps.translations.outputs.changed == 'true'
        run: python scripts/build_static.py
      - name: Save validated translations and queue
        if: steps.translations.outputs.changed == 'true'
        run: |
          git config user.name 'Culture Desk translation publisher'
          git config user.email 'updater@users.noreply.github.com'
          git add data/live.json data/quality.json data/translation-queue.json data/translation-queue data/translation-input frontend/data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated ChatGPT translations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
