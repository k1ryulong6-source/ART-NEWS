<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee9dc">
  <meta name="description" content="幕间休息：面向公众的艺术、电影与摄影新闻资讯平台，支持新闻查询、中文阅览和原文切换。">
  <title>幕间休息</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/intermission-masthead-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
  <script defer src="data.js"></script>
  <script defer src="core.js"></script>
  <script defer src="ui.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="paper-shell">
    <header class="masthead" data-ui="masthead">
      <div class="nameplate"><div class="edition-left"><time id="edition-date"></time><span>艺术 · 电影 · 摄影</span></div><a class="brand" href="#today" aria-label="幕间休息首页">幕间休息</a><div class="edition-right"><button id="coordinate-button" class="text-link" aria-label="阅读设置">设置</button><a href="#coverage" class="text-link">收录与译文</a></div></div>
      <div class="paper-toolbar"><nav aria-label="主要导航" id="navigation"></nav><div class="topbar"><label class="search-field"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索新闻、人物、展览" aria-label="搜索资讯"></label><div class="topbar-right"><button class="refresh-control" data-action="refresh" aria-label="刷新资讯">↻</button><button class="profile" id="inbox-button" data-action="inbox" aria-label="收藏活动提醒">提醒</button></div></div></div>
    </header>
    <div class="workspace">
      <main id="main" tabindex="-1"></main>
      <footer><span class="footer-brand">幕间休息</span><span id="edition-note" hidden>原文与译文标注。</span><a class="text-link" href="#coverage">收录与译文</a><a class="text-link" href="#settings">阅读偏好</a></footer>
    </div>
  </div>
  <dialog id="detail-dialog" aria-labelledby="detail-title"><button id="close-detail" class="dialog-close" aria-label="关闭详情">×</button><div id="detail-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">请启用 JavaScript 阅读资讯与使用筛选、日历和收藏。</p></noscript>
</body>
</html>
