name: Audit autonomous acceptance
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: cultural-news-data-write
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/audit_autonomous_trial.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/audit_article_quality.py --limit 60
      - run: python scripts/update_acceptance.py
      - name: Save genuine audit evidence
        run: |
          git config user.name 'Culture Desk auditor'
          git config user.email 'updater@users.noreply.github.com'
          git add data/article-quality data/article-quality-report.json data/autonomous-trial-report.json data/trial-runs data/acceptance.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save structural quality and autonomous acceptance evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
