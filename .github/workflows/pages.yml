name: Publish public news page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'config/**'
      - 'data/live.json'
      - 'data/headlines/**'
      - 'data/coverage-*.json'
      - 'backend/headlines.py'
      - 'backend/coverage.py'
      - 'backend/operations.py'
      - 'backend/priority.py'
      - 'backend/frontpage.py'
      - 'backend/editorial_regions.py'
      - 'backend/attention_units.py'
      - 'backend/presentation.py'
      - 'backend/autonomous_translation.py'
      - 'backend/offline_model.py'
      - 'backend/babel_export.py'
      - 'scripts/build_static.py'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Refresh cultural news', 'Publish daily AI translations', 'Automatic full-text translation', 'Verify Gemini full-text translation', 'Clean saved article bodies']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || ((github.event.workflow_run.name == 'Automatic full-text translation' || github.event.workflow_run.name == 'Verify Gemini full-text translation') && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check administrator-enabled Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /tmp/pages.json 2>/tmp/pages-error.txt; then
            if jq -e '.build_type == "workflow"' /tmp/pages.json >/dev/null; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'enabled=false' >> "$GITHUB_OUTPUT"
          echo 'Pages is not ready for Actions deployment. Select GitHub Actions in Settings → Pages.' >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: readiness
    if: needs.readiness.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
